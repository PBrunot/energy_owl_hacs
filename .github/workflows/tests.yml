name: Tests

on:
  push:
    branches: [main, ha-update]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Run pytest (${{ matrix.requirements }})
    strategy:
      matrix:
        requirements: [requirements-test-min.txt, requirements-test.txt]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install test dependencies
        run: pip install -r ${{ matrix.requirements }}

      - name: Run tests
        run: pytest --tb=short -v
